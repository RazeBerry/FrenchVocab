[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-builder"
version = "3.0.0"
description = "AI-assisted CLI for building vocabulary lists, generating LaTeX documents, and exporting Anki decks"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "RazeBerry" },
]
keywords = ["vocabulary", "language-learning", "anki", "latex", "llm", "english", "french", "german"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "anthropic~=0.84.0",
    "genanki~=0.13.1",
    "rich~=13.7.1",
    "keyring~=25.7.0",
    "google-genai>=0.2.0",
    "prompt_toolkit>=3.0,<4.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
vocabbuilder = "vocab_builder.cli.main:main"

[tool.setuptools]
py-modules = ["FrenchVocab"]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["vocab_builder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
