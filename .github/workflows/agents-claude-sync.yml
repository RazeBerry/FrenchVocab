name: Enforce AGENTS and CLAUDE Sync

on:
  pull_request:
  push:

jobs:
  docs-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ensure CLAUDE.md mirrors canonical AGENTS.md
        run: python3 scripts/sync_agent_docs.py --check
