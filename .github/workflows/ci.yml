name: CI

on:
  pull_request:
  push:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest ruff build

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build wheel
        run: python -m build --wheel

      - name: Check built metadata
        run: python -m twine check dist/*

      - name: Create clean virtualenv
        run: python -m venv .venv-smoke

      - name: Install built wheel
        run: .venv-smoke/bin/pip install dist/*.whl

      - name: Smoke test console entrypoint
        run: .venv-smoke/bin/vocabbuilder --help

      - name: Smoke test module entrypoint
        run: cd /tmp && "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -m vocab_builder --help

      - name: Smoke test legacy shim import
        run: cd /tmp && "$GITHUB_WORKSPACE/.venv-smoke/bin/python" -c "import FrenchVocab; import vocab_builder; assert callable(FrenchVocab.main); print(vocab_builder.__version__)"
