<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" id="theme-color" content="#efeae3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="VocabBuilder">
    <title>VocabBuilder</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="/static/icon.svg">
    <script>
      // Stamp the theme before first paint, or the page flashes light on the
      // way to dark. The OS preference only seeds the very first visit.
      (function () {
        var stored = null;
        try { stored = localStorage.getItem("vocabbuilder-theme"); } catch (error) { /* private mode */ }
        var theme = stored === "light" || stored === "dark"
          ? stored
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="stylesheet" href="/static/styles.css?v=5">
    <script src="/static/app.js?v=5" defer></script>
  </head>
  <body>
    <div class="app">
      <header class="bar">
        <div class="langs" id="languages" role="group" aria-label="Collection"></div>
        <p class="count"><strong id="entry-count">&mdash;</strong> <span id="entry-noun">collected</span></p>
        <button class="theme" id="theme-toggle" type="button">
          <span class="sr-only" id="theme-label">Switch to dark theme</span>
        </button>
        <button class="conn" id="connection" type="button">
          <span class="sr-only" id="connection-label">Connecting</span>
        </button>
      </header>

      <main class="stage">
        <div class="deck" id="deck">
          <article class="slip is-capturing" id="slip">
            <div class="slip-head">
              <label class="sr-only" id="entry-label" for="entry-input">Word or phrase</label>
              <textarea
                id="entry-input"
                class="hw hw--s1"
                rows="1"
                maxlength="1000"
                placeholder="Type a word"
                enterkeyhint="go"
                autocapitalize="off"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
              ></textarea>
              <h2 class="hw hw--s1" id="preview-word" hidden></h2>
              <div class="short"></div>
              <p class="pos" id="slip-pos">&nbsp;</p>
            </div>

            <div class="slip-body" id="slip-body">
              <p class="mean" id="slip-mean">The meaning will appear here.</p>
              <div id="slip-example"></div>
              <ol class="senses" id="slip-senses" hidden></ol>
              <div id="slip-examples" hidden></div>
              <button class="more" id="more-button" type="button" aria-expanded="false" hidden>
                <span id="more-label"></span>
                <i class="chev" aria-hidden="true"></i>
              </button>
            </div>
          </article>
        </div>
      </main>

      <div class="acts">
        <button class="ghost-button" id="discard-button" type="button" hidden>Discard</button>
        <button class="solid-button" id="primary-button" type="button" disabled>
          <span class="button-label" id="primary-label">Look it up</span>
          <span class="button-loader" aria-hidden="true"></span>
        </button>
      </div>

      <p class="message" id="form-message" role="alert"></p>

      <section class="collection">
        <h2>Your collection</h2>
        <label class="search">
          <span aria-hidden="true">&#8981;</span>
          <span class="sr-only">Search your collection</span>
          <input id="search-input" type="search" placeholder="Search words or meanings" autocomplete="off">
        </label>
        <div class="entry-list" id="entry-list" aria-live="polite"></div>
        <p class="empty-state" id="empty-state">Your most recent additions will appear here.</p>
      </section>

      <aside class="install-tip" id="install-tip" hidden>
        <div>
          <strong>Keep it one tap away</strong>
          <p>Tap Share, then &ldquo;Add to Home Screen&rdquo;.</p>
        </div>
        <button id="dismiss-install" type="button" aria-label="Dismiss">&times;</button>
      </aside>

      <footer>
        <span>Private through Tailscale</span>
        <span aria-hidden="true">&middot;</span>
        <span id="data-file">&mdash;</span>
      </footer>
    </div>
  </body>
</html>
