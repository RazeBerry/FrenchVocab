<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- The display face is the app's personality, so the face is the mark: a
       didone V standing on the collection hue's short rule. A single letterform
       is the only thing that survives a 16px tab strip intact.
       Colours are the tokens card-blank, ink and hue-fr from styles.css.
       Note: an XML comment may not contain a double hyphen, so token names are
       written bare here rather than in their CSS custom-property form.
       Art spans 23-77% of the canvas, inside the maskable safe circle. -->
